<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuxuru - Digital Name Investigator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; color: white; padding: 40px 0; }
        .header h1 { font-size: 3em; margin-bottom: 10px; }
        .card { background: white; border-radius: 10px; padding: 30px; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; }
        .btn { background: #667eea; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        .btn:hover { background: #5568d3; }
        .btn-success { background: #48bb78; }
        .btn-success:hover { background: #38a169; }
        .hidden { display: none; }
        .result-box { background: #f7fafc; padding: 20px; border-radius: 5px; margin-top: 20px; }
        .score-display { font-size: 3em; font-weight: bold; text-align: center; color: #667eea; }
        .package-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .package-card { background: #f7fafc; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #e2e8f0; }
        .package-card.featured { border-color: #667eea; background: #ebf4ff; }
        .status-available { color: #48bb78; font-weight: bold; }
        .status-taken { color: #f56565; font-weight: bold; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { color: white; }
        #auth-section, #dashboard-section { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Zuxuru</h1>
            <p>Digital Name Investigation Platform</p>
        </div>

        <div class="nav" id="nav-section">
            <div class="user-info" id="user-info"></div>
            <div>
                <button class="btn" onclick="showSection('auth-section')">Login/Register</button>
                <button class="btn btn-success" onclick="showSection('packages-section')">View Packages</button>
            </div>
        </div>

        <!-- Auth Section -->
        <div class="card" id="auth-section">
            <h2>Authentication</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <button class="btn" onclick="register()">Register</button>
            <button class="btn btn-success" onclick="login()">Login</button>
        </div>

        <!-- Dashboard Section -->
        <div class="card" id="dashboard-section">
            <h2>Investigate a Name</h2>
            <div class="form-group">
                <label>Business/Brand Name</label>
                <input type="text" id="brand-name" placeholder="e.g., Zuxuru">
            </div>
            <button class="btn btn-success" onclick="investigate()">Run Investigation</button>
            <div id="results" class="hidden"></div>
        </div>

        <!-- Packages Section -->
        <div class="card" id="packages-section">
            <h2>Subscription Packages</h2>
            <div class="package-grid" id="package-list"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        
        function showSection(sectionId) {
            ['auth-section', 'dashboard-section', 'packages-section'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById(sectionId).style.display = 'block';
        }

        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (token) options.headers['Authorization'] = `Bearer ${token}`;
            if (data) options.body = JSON.stringify(data);
            
            const response = await fetch(endpoint, options);
            if (response.status === 401) {
                localStorage.removeItem('token');
                token = null;
                alert('Session expired. Please login again.');
                return null;
            }
            return await response.json();
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = await apiCall('/register', 'POST', { email, password });
            if (result) alert(result.message || 'Registration successful!');
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);
            
            const response = await fetch('/token', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.access_token) {
                token = result.access_token;
                localStorage.setItem('token', token);
                alert('Login successful!');
                loadDashboard();
            } else {
                alert(result.detail || 'Login failed');
            }
        }

        async function loadDashboard() {
            const user = await apiCall('/me');
            if (user) {
                document.getElementById('user-info').innerHTML = `
                    <strong>${user.email}</strong> | Package: ${user.package} | Credits: ${user.credits}
                `;
                showSection('dashboard-section');
            }
        }

        async function investigate() {
            const name = document.getElementById('brand-name').value;
            if (!name) return alert('Please enter a name');
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Investigating...</p>';
            resultsDiv.classList.remove('hidden');
            
            const result = await apiCall(`/investigate?name=${encodeURIComponent(name)}`, 'POST');
            if (result) {
                let domainsHtml = '';
                for (const [domain, available] of Object.entries(result.domains)) {
                    domainsHtml += `<div>${domain}: <span class="${available ? 'status-available' : 'status-taken'}">${available ? '✅ Available' : '❌ Taken'}</span></div>`;
                }
                
                let socialHtml = '';
                for (const [platform, available] of Object.entries(result.social)) {
                    socialHtml += `<div>${platform}: <span class="${available ? 'status-available' : 'status-taken'}">${available ? '✅ Available' : '❌ Taken'}</span></div>`;
                }
                
                let recsHtml = result.recommendations.map(r => `<li>${r}</li>`).join('');
                
                resultsDiv.innerHTML = `
                    <div class="result-box">
                        <div class="score-display">${result.overall_score}%</div>
                        <p style="text-align:center">Overall Availability Score</p>
                        <h3>Domains (${result.domain_score}%)</h3>
                        ${domainsHtml}
                        <h3>Social Media (${result.social_score}%)</h3>
                        ${socialHtml}
                        <h3>Recommendations</h3>
                        <ul>${recsHtml}</ul>
                    </div>
                `;
            }
        }

        async function loadPackages() {
            const packages = await apiCall('/packages');
            if (packages) {
                const packageList = document.getElementById('package-list');
                packageList.innerHTML = Object.entries(packages).map(([key, pkg]) => `
                    <div class="package-card ${key === 'pro' ? 'featured' : ''}">
                        <h3>${key.toUpperCase()}</h3>
                        <p style="font-size: 1.5em; font-weight: bold; color: #667eea">${pkg.price}</p>
                        <p>${pkg.credits} credits/month</p>
                        <ul style="text-align: left; margin: 15px 0;">
                            ${pkg.features.map(f => `<li>✓ ${f}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            }
        }

        // Initialize
        if (token) {
            loadDashboard();
        } else {
            showSection('auth-section');
        }
        loadPackages();
    </script>
</body>
</html>
